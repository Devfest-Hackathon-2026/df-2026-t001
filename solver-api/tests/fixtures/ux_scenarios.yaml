# U5 台本のある会話（bench/ux_loop.py）。場面は artifacts/ux/uncovered.md（U0）の一覧から選ぶ。
# 1手（turn）: say=師長の言葉、draft=偽物の LLM が返す下書き（本物の LLM では使わない）、expect=AI の答えの期待、
#   choose=何番目の候補を足すか（null なら足さない）。
# check: rule_kept=最後に足したルールがすべて守られるか、changed_ratio_max=変わったセル ≤ 倍率 × 足す前の破れ（§2 の目安 5倍）、
#   explain_mentions_rule=作れなかったときの説明に足したルールの名前が出るか、made=作れるか。
# 2026-11-21 作成。結果に合わせて expect・check を変えない（変えたくなったら止めて理由を言う）。

# ---------------------------------------------------------------- 部品で書ける：同じ条件を3通りの言い方で（U0 No.06）
- id: ikegami2-night-rest-clear
  data: ikegami-2shift
  source: 池上 2Shift No.06（はっきりした言い方）
  kind: 書ける
  turns:
    - say: "夜勤の翌々日まで勤務を入れないで（夜勤明けの次も休みにして）"
      draft: {type: succession, pattern: [["夜勤"], ["休"], ["早番", "夜勤"]]}
      expect: {kind: candidates, rule_type: succession, pattern_len: 3}
      choose: 0
  check: {rule_kept: true, changed_ratio_max: 5}

