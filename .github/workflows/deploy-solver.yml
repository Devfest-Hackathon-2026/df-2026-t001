name: Deploy care-solver-api (CP-SAT / Gemini / learning API)

on:
  push:
    branches: [main]
    paths: ["solver-api/**", "scripts/synth/**", ".github/workflows/deploy-solver.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-solver
  cancel-in-progress: true

env:
  PROJECT_ID: gdgoc-514203
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/gdgoc-514203/cloud-run-source-deploy/care-solver-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r solver-api/requirements-dev.txt
      # テストは合成データ（scripts/synth/generate.py。シード固定）を一時ディレクトリに生成して使う。GCP には接続しない
      - run: cd solver-api && python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation（鍵ファイル不要）
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}   # terraform output wif_provider
          service_account: ${{ vars.DEPLOYER_SA }}               # terraform output deployer_sa
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Build and push image
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:${{ github.sha }}" solver-api
          docker push "$IMAGE:${{ github.sha }}"
      # イメージだけを差し替える（環境変数・サービスアカウント・CPU/メモリは Terraform の設定のまま）
      - name: Deploy Cloud Run
        run: gcloud run deploy care-solver-api --image "$IMAGE:${{ github.sha }}" --region "$REGION" --project "$PROJECT_ID"
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe care-solver-api --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/api/healthz" && exit 0; sleep 5; done
          echo "healthz failed" && exit 1
