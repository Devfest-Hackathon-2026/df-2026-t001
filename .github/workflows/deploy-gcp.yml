# 注: このワークフローは開発用リポジトリ 32Lwk/gdgoc-care-connect で実行される。
# GCP 側の Workload Identity Federation はそのリポジトリのみを信頼する設定（infra/variables.tf の github_repo）のため、
# 提出用リポジトリ（本リポジトリ）では deploy ジョブが認証できず実行されない。参照用に同じ定義を置いている。
name: Deploy to GCP (care-api + Firebase Hosting)

on:
  push:
    branches: [main]
    paths: ["api/**", "firestore.rules", "src/**", "public/**", "index.html", "employee.html", "package.json", "package-lock.json", "vite.config.ts", "tsconfig.json", "firebase.json", ".github/workflows/deploy-gcp.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-gcp-hosting
  cancel-in-progress: true

env:
  PROJECT_ID: gdgoc-514203
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/gdgoc-514203/cloud-run-source-deploy/care-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r api/requirements-dev.txt
      - run: cd api && python -m pytest -q
      # フロントエンドの型チェック + ビルド（tsc --noEmit && vite build）。デプロイ前に壊れていないことを確認する
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation（鍵ファイル不要）
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}   # terraform output wif_provider
          service_account: ${{ vars.DEPLOYER_SA }}               # terraform output deployer_sa
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      # Cloud Build（ソースバケット/actAs 権限が必要）を使わず、ランナー上でビルドして Artifact Registry へ push する
      - name: Build and push API image
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:${{ github.sha }}" api
          docker push "$IMAGE:${{ github.sha }}"
      - name: Deploy Cloud Run
        run: gcloud run deploy care-api --image "$IMAGE:${{ github.sha }}" --region "$REGION" --project "$PROJECT_ID"
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: Build UI (Vite)
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Deploy Firebase Hosting and Firestore rules
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --project "$PROJECT_ID"
