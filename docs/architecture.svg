<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" font-family="Noto Sans JP, Hiragino Sans, Meiryo, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a73e8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34a853"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f6368"/></marker></defs>
<rect width="1280" height="880" fill="#f8f9fa"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#202124">助っ人ケア（介護施設の夜勤欠員対応）— アーキテクチャ</text>
<text x="40" y="68" font-size="13" fill="#5f6368">Google Cloud: asia-northeast1（Gemini は global エンドポイント）。データはすべて架空。</text>
<rect x="24" y="90" width="1232" height="480" rx="16" fill="#ffffff" stroke="#e8eaed"/><text x="44" y="116" font-size="13" font-weight="600" fill="#1a73e8">リアルタイム（利用時）</text>
<rect x="24" y="590" width="1232" height="250" rx="16" fill="#ffffff" stroke="#e8eaed"/><text x="44" y="616" font-size="13" font-weight="600" fill="#34a853">学習（週次・Vertex AI Pipelines）</text>
<rect x="48" y="300" width="180" height="96" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<text x="64" y="334" font-size="17" font-weight="600" fill="#202124">リーダー・従業員</text>
<text x="64" y="358" font-size="13" fill="#5f6368">ブラウザ / スマホ</text>
<text x="64" y="378" font-size="13" fill="#5f6368">Preact + Vite UI</text>
<rect x="268" y="300" width="190" height="96" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<text x="284" y="334" font-size="17" font-weight="600" fill="#202124">Firebase Hosting</text>
<text x="284" y="358" font-size="13" fill="#5f6368">UI 配信・CSP</text>
<text x="284" y="378" font-size="13" fill="#5f6368">/api/** → care-api</text>
<rect x="520" y="140" width="230" height="96" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<image x="532" y="152" width="44" height="44" href="data:image/svg+xml;base64,"/>
<text x="586" y="174" font-size="17" font-weight="600" fill="#202124">care-api</text>
<text x="586" y="198" font-size="13" fill="#5f6368">画面状態の同期</text>
<text x="586" y="218" font-size="13" fill="#5f6368">Firestore: state</text>
<rect x="520" y="270" width="380" height="270" rx="12" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
<image x="532" y="282" width="44" height="44" href="data:image/svg+xml;base64,"/>
<text x="586" y="304" font-size="17" font-weight="600" fill="#202124">care-solver-api</text>
<text x="586" y="328" font-size="13" fill="#5f6368">4 vCPU・2GiB・公開（IP 制限）</text>
<text x="586" y="348" font-size="13" fill="#5f6368"></text>
<text x="586" y="368" font-size="13" fill="#5f6368">CP-SAT：月次＋日次（集約制約で連携）</text>
<text x="586" y="388" font-size="13" fill="#5f6368">欠員フロー・最小変更の組み直し</text>
<text x="586" y="408" font-size="13" fill="#5f6368">応諾確率で候補を順位付け（学習済みモデル）</text>
<text x="586" y="428" font-size="13" fill="#5f6368">AI：ルール翻訳・説明・チャット（読み取り＋提案）</text>
<text x="586" y="448" font-size="13" fill="#5f6368">反復検出の候補・ルール管理</text>
<rect x="960" y="130" width="270" height="92" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<text x="976" y="164" font-size="17" font-weight="600" fill="#202124">Gemini（Vertex AI）</text>
<text x="976" y="188" font-size="13" fill="#5f6368">Pro: 翻訳 / Flash: 説明・チャット</text>
<text x="976" y="208" font-size="13" fill="#5f6368">ADC（API キー無し）</text>
<rect x="960" y="240" width="270" height="76" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<text x="976" y="274" font-size="17" font-weight="600" fill="#202124">Sensitive Data Protection</text>
<text x="976" y="298" font-size="13" fill="#5f6368">入力の個人情報を伏せ字</text>
<rect x="960" y="336" width="270" height="92" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<text x="976" y="370" font-size="17" font-weight="600" fill="#202124">Firestore</text>
<text x="976" y="394" font-size="13" fill="#5f6368">施設・従業員・提案（不変）</text>
<text x="976" y="414" font-size="13" fill="#5f6368">編集ログ（追記）・欠員・ルール</text>
<rect x="960" y="448" width="270" height="92" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<text x="976" y="482" font-size="17" font-weight="600" fill="#202124">Pub/Sub</text>
<text x="976" y="506" font-size="13" fill="#5f6368">業務イベント（打診・応答…）</text>
<text x="976" y="526" font-size="13" fill="#5f6368">→ BigQuery subscription</text>
<rect x="48" y="650" width="300" height="150" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<image x="60" y="662" width="44" height="44" href="data:image/svg+xml;base64,"/>
<text x="114" y="684" font-size="17" font-weight="600" fill="#202124">Vertex AI Pipelines</text>
<text x="114" y="708" font-size="13" fill="#5f6368">extract → train → promote</text>
<text x="114" y="728" font-size="13" fill="#5f6368">施設ごとに3種類のモデルを</text>
<text x="114" y="748" font-size="13" fill="#5f6368">交差検証で比べ、基準に勝てた</text>
<text x="114" y="768" font-size="13" fill="#5f6368">ものだけ昇格・Registry に登録</text>
<text x="114" y="788" font-size="13" fill="#5f6368">手修正のくり返しの検出も実行</text>
<rect x="440" y="650" width="280" height="150" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<image x="452" y="662" width="44" height="44" href="data:image/svg+xml;base64,"/>
<text x="506" y="684" font-size="17" font-weight="600" fill="#202124">BigQuery</text>
<text x="506" y="708" font-size="13" fill="#5f6368">履歴・特徴量・予測（out-of-fold）</text>
<text x="506" y="728" font-size="13" fill="#5f6368">学習の記録（model_runs）</text>
<text x="506" y="748" font-size="13" fill="#5f6368">チャットの集計（読み取り専用）</text>
<rect x="800" y="650" width="300" height="150" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<image x="812" y="662" width="44" height="44" href="data:image/svg+xml;base64,"/>
<text x="866" y="684" font-size="17" font-weight="600" fill="#202124">Cloud Storage</text>
<text x="866" y="708" font-size="13" fill="#5f6368">models/&lt;施設&gt;/champion.json</text>
<text x="866" y="728" font-size="13" fill="#5f6368">learned/&lt;施設&gt;.json（ルール候補）</text>
<text x="866" y="748" font-size="13" fill="#5f6368">実行の中間成果物（30日で削除）</text>
