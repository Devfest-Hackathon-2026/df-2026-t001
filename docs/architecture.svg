<text x="40" y="866" font-size="12" fill="#80868b">アイコン: Google Cloud 公式（cloud.google.com/icons。Cloud Run・BigQuery・Cloud Storage・Vertex AI は無加工）。そのほかのサービスは文字のみ。</text>
